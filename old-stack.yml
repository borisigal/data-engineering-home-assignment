AWSTemplateFormatVersion: '2010-09-09'
Description: 'Data Engineering Assignment Infrastructure - Stock Analysis with Glue and Athena'

Parameters:
  ProjectName:
    Type: String
    Default: data-engineer-assignment-barry-sigal
    Description: Project name used for resource naming

  GlueScriptLocation:
    Type: String
    Description: S3 location of the Glue job script (will be set during deployment)
    Default: placeholder-will-be-updated

Resources:
  # S3 Bucket for data storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-data'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldGlueJobLogs
            Status: Enabled
            Prefix: glue-logs/
            ExpirationInDays: 30
