<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="28" font-weight="bold" fill="#232f3e">Stock Analysis Data Pipeline - Complete Architecture</text>
  <text x="600" y="55" text-anchor="middle" font-size="16" fill="#666">Automated Daily Processing with AWS Step Functions</text>
  
  <!-- EventBridge Scheduler -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="160" height="80" fill="#FF9900" rx="5"/>
    <text x="80" y="35" text-anchor="middle" fill="white" font-size="14" font-weight="bold">EventBridge</text>
    <text x="80" y="55" text-anchor="middle" fill="white" font-size="12">Scheduler</text>
    <text x="80" y="70" text-anchor="middle" fill="white" font-size="10">(Daily 9 AM UTC)</text>
  </g>
  
  <!-- Step Functions -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="180" height="80" fill="#E7157B" rx="5"/>
    <text x="90" y="35" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Step Functions</text>
    <text x="90" y="55" text-anchor="middle" fill="white" font-size="12">State Machine</text>
  </g>
  
  <!-- S3 Input Bucket -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="140" height="80" fill="#569A31" rx="5"/>
    <text x="70" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="bold">S3 Input</text>
    <text x="70" y="50" text-anchor="middle" fill="white" font-size="12">input_data/</text>
    <text x="70" y="65" text-anchor="middle" fill="white" font-size="11">stocks_data.csv</text>
  </g>
  
  <!-- Glue Job -->
  <g transform="translate(300, 250)">
    <rect x="0" y="0" width="180" height="80" fill="#FF9900" rx="5"/>
    <text x="90" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="bold">AWS Glue Job</text>
    <text x="90" y="50" text-anchor="middle" fill="white" font-size="12">PySpark Processing</text>
    <text x="90" y="65" text-anchor="middle" fill="white" font-size="11">(G.1X, 2 workers)</text>
  </g>
  
  <!-- S3 Output Bucket -->
  <g transform="translate(600, 250)">
    <rect x="0" y="0" width="140" height="80" fill="#569A31" rx="5"/>
    <text x="70" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="bold">S3 Output</text>
    <text x="70" y="50" text-anchor="middle" fill="white" font-size="12">results/</text>
    <text x="70" y="65" text-anchor="middle" fill="white" font-size="11">Parquet Files</text>
  </g>
  
  <!-- Glue Crawler -->
  <g transform="translate(850, 250)">
    <rect x="0" y="0" width="140" height="80" fill="#FF9900" rx="5"/>
    <text x="70" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Glue Crawler</text>
    <text x="70" y="60" text-anchor="middle" fill="white" font-size="12">Results Crawler</text>
  </g>
  
  <!-- Glue Data Catalog -->
  <g transform="translate(300, 400)">
    <rect x="0" y="0" width="580" height="100" fill="#FF9900" rx="5"/>
    <text x="290" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Glue Data Catalog</text>
    <text x="290" y="50" text-anchor="middle" fill="white" font-size="12">Database: data_engineer_assignment_barry_sigal_db</text>
    
    <!-- Tables -->
    <text x="100" y="75" text-anchor="middle" fill="white" font-size="11">avg_daily_returns</text>
    <text x="250" y="75" text-anchor="middle" fill="white" font-size="11">highest_worth_stock</text>
    <text x="400" y="75" text-anchor="middle" fill="white" font-size="11">most_volatile_stock</text>
    <text x="550" y="75" text-anchor="middle" fill="white" font-size="11">top_thirty_day_returns</text>
  </g>
  
  <!-- Athena -->
  <g transform="translate(450, 550)">
    <rect x="0" y="0" width="140" height="80" fill="#232F3E" rx="5"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Amazon Athena</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-size="12">SQL Queries</text>
  </g>
  
  <!-- S3 Athena Results -->
  <g transform="translate(700, 550)">
    <rect x="0" y="0" width="140" height="80" fill="#569A31" rx="5"/>
    <text x="70" y="35" text-anchor="middle" fill="white" font-size="14" font-weight="bold">S3 Results</text>
    <text x="70" y="55" text-anchor="middle" fill="white" font-size="12">athena-results/</text>
  </g>
  
  <!-- IAM Roles -->
  <g transform="translate(950, 100)">
    <rect x="0" y="0" width="200" height="200" fill="#DD344C" rx="5" fill-opacity="0.1" stroke="#DD344C" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#DD344C">IAM Roles</text>
    
    <rect x="10" y="40" width="180" height="30" fill="#DD344C" rx="3"/>
    <text x="100" y="58" text-anchor="middle" fill="white" font-size="11">scheduler-role</text>
    
    <rect x="10" y="75" width="180" height="30" fill="#DD344C" rx="3"/>
    <text x="100" y="93" text-anchor="middle" fill="white" font-size="11">stepfunctions-role</text>
    
    <rect x="10" y="110" width="180" height="30" fill="#DD344C" rx="3"/>
    <text x="100" y="128" text-anchor="middle" fill="white" font-size="11">glue-job-role</text>
    
    <rect x="10" y="145" width="180" height="30" fill="#DD344C" rx="3"/>
    <text x="100" y="163" text-anchor="middle" fill="white" font-size="11">crawler-role</text>
  </g>
  
  <!-- CloudFormation -->
  <g transform="translate(950, 350)">
    <rect x="0" y="0" width="200" height="80" fill="#759EEA" rx="5"/>
    <text x="100" y="35" text-anchor="middle" fill="white" font-size="14" font-weight="bold">CloudFormation</text>
    <text x="100" y="55" text-anchor="middle" fill="white" font-size="12">IaC Deployment</text>
  </g>
  
  <!-- Arrows -->
  <!-- Scheduler to Step Functions -->
  <path d="M 210 140 L 300 140" stroke="#FF9900" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)"/>
  <text x="255" y="135" text-anchor="middle" font-size="12" fill="#666">Triggers</text>
  
  <!-- Step Functions to Glue Job -->
  <path d="M 390 180 L 390 250" stroke="#E7157B" stroke-width="3" fill="none" marker-end="url(#arrowhead-pink)"/>
  <text x="410" y="215" font-size="12" fill="#666">1. Start Job</text>
  
  <!-- Input to Glue Job -->
  <path d="M 190 290 L 300 290" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="245" y="285" text-anchor="middle" font-size="12" fill="#333">Read</text>
  
  <!-- Glue Job to Output -->
  <path d="M 480 290 L 600 290" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="540" y="285" text-anchor="middle" font-size="12" fill="#333">Write</text>
  
  <!-- Step Functions to Crawler -->
  <path d="M 480 140 L 920 140 L 920 250" stroke="#E7157B" stroke-width="3" fill="none" marker-end="url(#arrowhead-pink)"/>
  <text x="700" y="135" text-anchor="middle" font-size="12" fill="#666">2. Start Crawler</text>
  
  <!-- Output to Crawler -->
  <path d="M 740 290 L 850 290" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="795" y="285" text-anchor="middle" font-size="12" fill="#333">Crawl</text>
  
  <!-- Crawler to Catalog -->
  <path d="M 920 330 L 920 380 L 880 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="940" y="365" font-size="12" fill="#333">Update</text>
  
  <!-- Catalog to Athena -->
  <path d="M 520 500 L 520 550" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="540" y="525" font-size="12" fill="#333">Query</text>
  
  <!-- Athena to Results -->
  <path d="M 590 590 L 700 590" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="645" y="585" text-anchor="middle" font-size="12" fill="#333">Results</text>
  
  <!-- CloudFormation deployment lines -->
  <path d="M 950 390 L 390 390 L 390 330" stroke="#759EEA" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M 950 390 L 120 390 L 120 330" stroke="#759EEA" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M 950 390 L 670 390 L 670 330" stroke="#759EEA" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M 950 390 L 920 390 L 920 330" stroke="#759EEA" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <!-- Process Flow Box -->
  <rect x="30" y="230" width="960" height="120" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="10,5" rx="10"/>
  <text x="40" y="225" font-size="14" fill="#666" font-weight="bold">Data Processing Pipeline</text>
  
  <!-- Output descriptions -->
  <g transform="translate(610, 350)">
    <text x="0" y="0" font-size="11" fill="#666" font-weight="bold">Output Files:</text>
    <text x="0" y="15" font-size="10" fill="#666">• avg_daily_returns/</text>
    <text x="0" y="28" font-size="10" fill="#666">• highest_worth_stock/</text>
    <text x="0" y="41" font-size="10" fill="#666">• most_volatile_stock/</text>
    <text x="0" y="54" font-size="10" fill="#666">• top_thirty_day_returns/</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 700)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Legend:</text>
    <rect x="0" y="10" width="30" height="20" fill="#FF9900" rx="3"/>
    <text x="35" y="25" font-size="12" fill="#333">AWS Glue Services</text>
    
    <rect x="150" y="10" width="30" height="20" fill="#569A31" rx="3"/>
    <text x="185" y="25" font-size="12" fill="#333">S3 Storage</text>
    
    <rect x="280" y="10" width="30" height="20" fill="#E7157B" rx="3"/>
    <text x="315" y="25" font-size="12" fill="#333">Step Functions</text>
    
    <rect x="430" y="10" width="30" height="20" fill="#232F3E" rx="3"/>
    <text x="465" y="25" font-size="12" fill="#333">Athena</text>
    
    <rect x="560" y="10" width="30" height="20" fill="#DD344C" rx="3"/>
    <text x="595" y="25" font-size="12" fill="#333">IAM</text>
    
    <rect x="680" y="10" width="30" height="20" fill="#759EEA" rx="3"/>
    <text x="715" y="25" font-size="12" fill="#333">CloudFormation</text>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9900"/>
    </marker>
    <marker id="arrowhead-pink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E7157B"/>
    </marker>
  </defs>
</svg>