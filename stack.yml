AWSTemplateFormatVersion: '2010-09-09'
Description: 'Data Engineering Assignment Infrastructure - Stock Analysis with Glue and Athena'

Parameters:
  ProjectName:
    Type: String
    Default: data-engineer-assignment-barry-sigal
    Description: Project name used for resource naming

Resources:
  # S3 Bucket for data storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-data'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # IAM Role for Glue Job
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-glue-job-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                Resource:
                  - !Sub '${DataBucket.Arn}'
                  - !Sub '${DataBucket.Arn}/*'

  # Glue Catalog Database
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${ProjectName}_db'
        Description: 'Database for stock analysis results'

  # Glue Job for PySpark processing
  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-stock-analysis-job'
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${DataBucket}/scripts/stock_analysis.py'
        PythonVersion: '3'
      DefaultArguments:
        '--TempDir': !Sub 's3://${DataBucket}/temp/'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--job-language': 'python'
        '--job-bookmark-option': 'job-bookmark-enable'
        '--input-path': !Sub 's3://${DataBucket}/input/stocks_data.csv'
        '--output-bucket': !Ref DataBucket
      ExecutionProperty:
        MaxConcurrentRuns: 1
      GlueVersion: '3.0'
      MaxRetries: 0
      Timeout: 60
      WorkerType: G.1X
      NumberOfWorkers: 2

  # IAM Role for Crawler
  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-crawler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: S3CrawlerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !Sub '${DataBucket.Arn}'
                  - !Sub '${DataBucket.Arn}/*'

  # Crawler for result files
  ResultsCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${ProjectName}-results-crawler'
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref GlueDatabase
      Description: 'Crawls the analysis results to create tables'
      Targets:
        S3Targets:
          - Path: !Sub 's3://${DataBucket}/results/'

  # Glue Tables with Parquet format
  AvgDailyReturnsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: avg_daily_returns
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: date
              Type: string
            - Name: average_return
              Type: double
          Location: !Sub 's3://${DataBucket}/results/avg_daily_returns/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
        PartitionKeys:
          - Name: year
            Type: int

  HighestWorthStockTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: highest_worth_stock
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: ticker
              Type: string
            - Name: value
              Type: double
          Location: !Sub 's3://${DataBucket}/results/highest_worth_stock/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  MostVolatileStockTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: most_volatile_stock
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: ticker
              Type: string
            - Name: standard_deviation
              Type: double
          Location: !Sub 's3://${DataBucket}/results/most_volatile_stock/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  TopThirtyDayReturnsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: top_thirty_day_returns
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: ticker
              Type: string
            - Name: date
              Type: string
          Location: !Sub 's3://${DataBucket}/results/top_thirty_day_returns/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  # Athena Workgroup
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${ProjectName}-workgroup'
      Description: 'Workgroup for stock analysis queries'
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DataBucket}/athena-results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true

Outputs:
  DataBucketName:
    Description: 'S3 bucket name'
    Value: !Ref DataBucket

  GlueJobName:
    Description: 'Glue job name'
    Value: !Ref GlueJob

  GlueDatabaseName:
    Description: 'Glue database name'
    Value: !Ref GlueDatabase

  CrawlerName:
    Description: 'Glue crawler name'
    Value: !Ref ResultsCrawler

  AthenaWorkgroupName:
    Description: 'Athena workgroup name'
    Value: !Ref AthenaWorkgroup