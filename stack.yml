AWSTemplateFormatVersion: '2010-09-09'
Description: 'Data Engineering Assignment Infrastructure - Stock Analysis with Glue and Athena'

Parameters:
  ProjectName:
    Type: String
    Default: data-engineer-assignment-barry-sigal
    Description: Project name used for resource naming

Resources:
  # S3 Bucket for data storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-data'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # IAM Role for Glue Job
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-glue-job-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                  - 's3:GetBucketLocation'
                  - 's3:GetBucketAcl'
                Resource:
                  - !Sub '${DataBucket.Arn}'
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'

  # Glue Catalog Database
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${ProjectName}_db'
        Description: 'Database for stock analysis results'

  # Glue Job for PySpark processing
  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-stock-analysis-job'
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${DataBucket}/scripts/stock-analysis-clean.py'
        PythonVersion: '3'
      DefaultArguments:
        '--TempDir': !Sub 's3://${DataBucket}/temp/'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--job-language': 'python'
        '--job-bookmark-option': 'job-bookmark-enable'
        '--input-path': !Sub 's3://${DataBucket}/input_data/stocks_data.csv'
        '--output-bucket': !Ref DataBucket
      ExecutionProperty:
        MaxConcurrentRuns: 1
      GlueVersion: '3.0'
      MaxRetries: 0
      Timeout: 60
      WorkerType: G.1X
      NumberOfWorkers: 2

  # IAM Role for Crawler
  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-crawler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: S3CrawlerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !Sub '${DataBucket.Arn}'
                  - !Sub '${DataBucket.Arn}/*'

  # Crawler for result files
  ResultsCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${ProjectName}-results-crawler'
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref GlueDatabase
      Description: 'Crawls the analysis results to create tables'
      Targets:
        S3Targets:
          - Path: !Sub 's3://${DataBucket}/results/'

  # Glue Tables with Parquet format
  AvgDailyReturnsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: avg_daily_returns
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: date
              Type: string
            - Name: average_return
              Type: double
          Location: !Sub 's3://${DataBucket}/results/avg_daily_returns/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
        PartitionKeys:
          - Name: year
            Type: int

  HighestWorthStockTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: highest_worth_stock
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: ticker
              Type: string
            - Name: value
              Type: double
          Location: !Sub 's3://${DataBucket}/results/highest_worth_stock/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  MostVolatileStockTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: most_volatile_stock
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: ticker
              Type: string
            - Name: standard_deviation
              Type: double
          Location: !Sub 's3://${DataBucket}/results/most_volatile_stock/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  TopThirtyDayReturnsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: top_thirty_day_returns
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Columns:
            - Name: ticker
              Type: string
            - Name: date
              Type: string
          Location: !Sub 's3://${DataBucket}/results/top_thirty_day_returns/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  # Athena Workgroup
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${ProjectName}-workgroup'
      Description: 'Workgroup for stock analysis queries'
      State: ENABLED  # Ensure workgroup is enabled
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DataBucket}/athena-results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        EngineVersion:
          SelectedEngineVersion: 'Athena engine version 3'  # Use latest engine

  # IAM Role for Step Functions
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-stepfunctions-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: StepFunctionsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'glue:StartJobRun'
                  - 'glue:GetJobRun'
                  - 'glue:BatchStopJobRun'
                  - 'glue:StartCrawler'
                  - 'glue:GetCrawler'
                Resource: '*'

  # Step Function State Machine
  StockAnalysisStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-stock-analysis-workflow'
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Run Glue Job and then Crawler",
          "StartAt": "RunGlueJob",
          "States": {
            "RunGlueJob": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {
                "JobName": "${GlueJob}"
              },
              "Next": "StartCrawler",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "JobFailed"
                }
              ]
            },
            "StartCrawler": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:startCrawler",
              "Parameters": {
                "Name": "${ResultsCrawler}"
              },
              "Next": "WaitForCrawler",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "CrawlerFailed"
                }
              ]
            },
            "WaitForCrawler": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "GetCrawlerStatus"
            },
            "GetCrawlerStatus": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:glue:getCrawler",
              "Parameters": {
                "Name": "${ResultsCrawler}"
              },
              "Next": "CheckCrawlerStatus",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "CrawlerFailed"
                }
              ]
            },
            "CheckCrawlerStatus": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.Crawler.State",
                  "StringEquals": "RUNNING",
                  "Next": "WaitForCrawler"
                },
                {
                  "Variable": "$.Crawler.State",
                  "StringEquals": "STOPPING",
                  "Next": "WaitForCrawler"
                }
               ],
              "Default": "CheckCrawlerLastStatus"
            },
            "CheckCrawlerLastStatus": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.Crawler.LastCrawl.Status",
                  "StringEquals": "SUCCEEDED",
                  "Next": "CrawlerSucceeded"
                }
              ],
              "Default": "CrawlerFailed"
            },
              "CrawlerSucceeded": {
              "Type": "Succeed"
            },
            "JobFailed": {
              "Type": "Fail",
              "Error": "GlueJobFailed",
              "Cause": "The Glue job failed to complete successfully"
            },
            "CrawlerFailed": {
              "Type": "Fail",
              "Error": "CrawlerFailed",
              "Cause": "The Glue crawler failed or is in unexpected state"
            }
          }
        }

  # IAM Role for EventBridge Scheduler
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: SchedulerExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'states:StartExecution'
                Resource: !Ref StockAnalysisStateMachine

  # EventBridge Scheduler for daily execution
  DailySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-daily-schedule'
      Description: 'Daily schedule for stock analysis workflow'
      ScheduleExpression: 'cron(0 9 * * ? *)'  # Run daily at 9 AM UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Ref StockAnalysisStateMachine
        RoleArn: !GetAtt SchedulerRole.Arn
      State: 'ENABLED'

Outputs:
  DataBucketName:
    Description: 'S3 bucket name'
    Value: !Ref DataBucket

  GlueJobName:
    Description: 'Glue job name'
    Value: !Ref GlueJob

  GlueDatabaseName:
    Description: 'Glue database name'
    Value: !Ref GlueDatabase

  CrawlerName:
    Description: 'Glue crawler name'
    Value: !Ref ResultsCrawler

  AthenaWorkgroupName:
    Description: 'Athena workgroup name'
    Value: !Ref AthenaWorkgroup

  AthenaOutputLocation:
    Description: 'Athena query results location'
    Value: !Sub 's3://${DataBucket}/athena-results/'

  StateMachineArn:
      Description: 'Step Functions State Machine ARN'
      Value: !Ref StockAnalysisStateMachine

  ScheduleName:
    Description: 'EventBridge Schedule Name'
    Value: !Ref DailySchedule